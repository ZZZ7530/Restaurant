{% extends "base.html" %}

{% block title %}2026 蛇年年菜菜單 | {{ restaurant_name }}{% endblock %}

{% block content %}
<section class="page-hero page-hero--newyear">
    <div class="container">
        <p class="section-kicker">New Year Menu</p>
        <h1>2026 蛇年年菜菜單</h1>
        <p>為家庭圍爐與春節聚餐準備的年菜組合，精選海味、桌菜與多人合菜，適合提前預訂、安心取餐。</p>
    </div>
</section>

<section class="home-section newyear-menu-page">
    <div class="home-container">
        <div class="newyear-menu-card">
            <img src="{{ url_for('static', filename='images/background/年菜菜單.jpg') }}" alt="2026 蛇年年菜菜單">
        </div>
        <div class="newyear-menu-actions">
            <a class="home-button home-button--primary" href="{{ url_for('public.index') }}">返回首頁</a>
        </div>
    </div>
</section>
{% endblock %}
