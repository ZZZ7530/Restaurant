<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>後台登入</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}?v=1">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-auth">
    <main class="login-panel">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}?v=3" alt="{{ restaurant_name }} Logo">
            <div>
                <strong>{{ restaurant_name }}</strong>
                <small>Restaurant Admin</small>
            </div>
        </div>
        <p class="admin-kicker">Restaurant Admin</p>
        <h1>後台登入</h1>
        <p class="text-muted">請輸入管理員帳號密碼，進入店家管理系統。</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('admin.login_post') }}">
            <label class="form-label" for="username">帳號</label>
            <input id="username" class="form-control" name="username" autocomplete="username" required>
            <label class="form-label mt-3" for="password">密碼</label>
            <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-primary w-100 mt-4" type="submit">登入</button>
        </form>
        <a class="login-back-link" href="{{ url_for('public.index') }}">回到官網首頁</a>
    </main>
</body>
</html>
