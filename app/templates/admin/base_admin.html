<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}後台管理系統{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}?v=1">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-layout">
    {% set active_endpoint = request.endpoint or "" %}
    <aside class="admin-sidebar">
        <a class="admin-brand" href="{{ url_for('admin.dashboard') }}">
            <img class="admin-brand__logo" src="{{ url_for('static', filename='images/logo.png') }}?v=3" alt="{{ restaurant_name }} Logo">
            <span class="admin-brand__text">
                <strong>{{ restaurant_name }}</strong>
                <small>Restaurant Admin</small>
            </span>
        </a>
        <nav>
            <a class="{% if active_endpoint == 'admin.dashboard' %}is-active{% endif %}" href="{{ url_for('admin.dashboard') }}">總覽</a>
            <a class="{% if 'reservation' in active_endpoint %}is-active{% endif %}" href="{{ url_for('admin.reservations') }}">訂位管理</a>
            <a class="{% if active_endpoint in ['admin.orders', 'admin.order_new', 'admin.order_create', 'admin.order_detail', 'admin.order_edit', 'admin.order_update'] %}is-active{% endif %}" href="{{ url_for('admin.orders') }}">外帶訂單</a>
            <a class="{% if active_endpoint == 'admin.dine_in_orders' %}is-active{% endif %}" href="{{ url_for('admin.dine_in_orders') }}">內用訂單</a>
            <a class="{% if active_endpoint == 'admin.table_qrcodes' %}is-active{% endif %}" href="{{ url_for('admin.table_qrcodes') }}">桌號 QR Code</a>
            <a class="{% if active_endpoint in ['admin.kitchen', 'admin.order_item_complete', 'admin.order_item_undo_complete', 'admin.order_complete'] %}is-active{% endif %}" href="{{ url_for('admin.kitchen') }}">出餐管理</a>
            <a class="{% if active_endpoint in ['admin.completed_orders', 'admin.order_delete_permanently'] %}is-active{% endif %}" href="{{ url_for('admin.completed_orders') }}">完成訂單</a>
            <a class="{% if 'menu' in active_endpoint and 'daily' not in active_endpoint %}is-active{% endif %}" href="{{ url_for('admin.menu_items') }}">菜單管理</a>
            <a class="{% if 'daily_price' in active_endpoint or active_endpoint == 'admin.daily_prices' %}is-active{% endif %}" href="{{ url_for('admin.daily_prices') }}">時價管理</a>
            <a href="{{ url_for('public.index') }}">回到官網</a>
        </nav>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div>
                <p class="admin-kicker">Restaurant Admin</p>
                <h1>{% block page_heading %}後台管理系統{% endblock %}</h1>
            </div>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin.logout') }}">登出</a>
        </header>

        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
